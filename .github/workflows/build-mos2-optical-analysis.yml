name: Build MoS2 optical analysis (Windows exe)

# Run manually from the Actions tab ("Run workflow"), or push a tag like `mos2-v1.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - "mos2-v*"

defaults:
  run:
    working-directory: MoS2_optical_analysis

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # gh release create
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MoS2_optical_analysis/packaging/requirements-build.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath dist/build packaging/mos2_optical_analysis.spec

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: mos2-analysis
          path: MoS2_optical_analysis/dist/mos2-analysis
          retention-days: 30

      # Tag builds only: publish the zipped app folder as a GitHub Release (public, no login, kept permanently).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/mos2-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "mos2-analysis-$($env:TAG -replace '^mos2-', '').zip"
          7z a -tzip $zip ./dist/mos2-analysis | Out-Null
          $notes = @"
          Windows app folder for MoS2 Raman/PL analysis.

          1. Download ``$zip`` below and unzip it.
          2. Run ``mos2-analysis.exe`` inside the ``mos2-analysis`` folder.
          3. Put sample folders under ``data\raw\raman`` or ``data\raw\pl``; see ``README.md`` in the folder.

          Build: commit $($env:GITHUB_SHA.Substring(0, 7))
          "@
          gh release create $env:TAG $zip --title "MoS2 optical analysis $($env:TAG -replace '^mos2-', '')" --notes $notes
