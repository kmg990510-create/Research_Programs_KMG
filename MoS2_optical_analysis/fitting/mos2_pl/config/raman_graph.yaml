# Streamlit graph/UI defaults for Raman report viewers

sample_comparison:
  default_report_count: 4
  status_filter:
    enabled_default: true
    allowed_default: ["valid", "attention"]
  # coefficients (strain/doping model) live in the root config.yaml.
  center_metric_default: "mean"
  error_metric_default: "std"
  overlay_scatter_default: true
  absolute_isolines:
    show_default: true
    density_default: "light"
    steps:
      light:
        eps_step: 0.1
        n_step: 0.1
      normal:
        eps_step: 0.1
        n_step: 0.1

all_spectra_viewer:
  x_window:
    fallback_min: 340.0
    fallback_max: 430.0
    peak_padding: 18.0

flagged_spectra:
  # legacy_thresholds (slider defaults) live in the root config.yaml.
