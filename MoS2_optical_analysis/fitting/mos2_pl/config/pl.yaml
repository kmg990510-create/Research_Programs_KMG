# Photoluminescence (PL) analysis configuration
models:
  - pl_single_gaussian
  - pl_single_pvoigt
selection_metric: hybrid
fit:
  x_unit: eV
  x_min: 1.38
  x_max: 2.33
  compare_x_min: 1.38
  compare_x_max: 2.33
  pl_center_init: 1.85
  pl_center_min: 1.50
  pl_center_max: 2.15
  pl_sigma_min: 0.002
  pl_sigma_max: 0.20

report_export:
  include_selected_fitted_y: false
  include_all_candidates: true
  include_candidate_fitted_y: false
