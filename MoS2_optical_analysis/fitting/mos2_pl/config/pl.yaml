# Photoluminescence (PL) analysis configuration
models:
  - pl_single_gaussian
  - pl_single_pvoigt
selection_metric: hybrid
fit:
  x_min: 520.0
  x_max: 780.0
  compare_x_min: 520.0
  compare_x_max: 780.0
