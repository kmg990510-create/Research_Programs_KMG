# Photoluminescence (PL) analysis configuration
models:
  - pl_single_pvoigt
  - pl_a_doublet_pvoigt
  - pl_5_component_pvoigt
selection_metric: hybrid
intensity_density_correction:
  enabled: false
despike:
  enabled: true
  kernel: 7
  threshold: 6.0
fit:
  x_unit: eV
  x_min: 1.38
  x_max: 2.33
  compare_x_min: 1.38
  compare_x_max: 2.33
  pl_center_init: 1.85
  pl_center_min: 1.50
  pl_center_max: 2.15
  pl_sigma_min: 0.002
  pl_sigma_max: 0.20
  a_minus_a0_split:
    enabled: true
    init: 0.030
    min: 0.015
    max: 0.055
  trion_exciton_fwhm_ratio:
    enabled: true
    init: 1.35
    min: 1.05
    max: 2.50
  share_exciton_fraction: true
  model_components:
    pl_single_pvoigt: [pl]
    pl_a_doublet_pvoigt: [a_minus, a0]
    pl_5_component_pvoigt: [i1, i2, a_minus, a0, b]
  components:
    pl:
      label: PL
      profile: pvoigt
      center_init: 1.85
      center_min: 1.50
      center_max: 2.15
      fwhm_init: 0.12
      fwhm_min: 0.004
      fwhm_max: 0.40
      height_scale: 1.0
      fraction_init: 0.5
    i1:
      label: I1
      profile: pvoigt
      center_init: 1.51
      center_min: 1.40
      center_max: 1.58
      fwhm_init: 0.13
      fwhm_min: 0.03
      fwhm_max: 0.28
      height_scale: 0.15
      fraction_init: 0.5
    i2:
      label: I2
      profile: pvoigt
      center_init: 1.63
      center_min: 1.54
      center_max: 1.76
      fwhm_init: 0.18
      fwhm_min: 0.04
      fwhm_max: 0.35
      height_scale: 0.20
      fraction_init: 0.5
    a_minus:
      label: A-
      profile: pvoigt
      center_init: 1.835
      center_min: 1.76
      center_max: 1.88
      fwhm_init: 0.095
      fwhm_min: 0.035
      fwhm_max: 0.16
      height_scale: 1.0
      fraction_init: 0.5
    a0:
      label: A0
      profile: pvoigt
      center_init: 1.865
      center_min: 1.80
      center_max: 1.93
      fwhm_init: 0.055
      fwhm_min: 0.020
      fwhm_max: 0.095
      height_scale: 0.30
      fraction_init: 0.5
    b:
      label: B
      profile: pvoigt
      center_init: 2.000
      center_min: 1.93
      center_max: 2.10
      fwhm_init: 0.135
      fwhm_min: 0.04
      fwhm_max: 0.28
      height_scale: 0.25
      fraction_init: 0.5

report_export:
  include_selected_fitted_y: false
  include_all_candidates: true
  include_candidate_fitted_y: false
