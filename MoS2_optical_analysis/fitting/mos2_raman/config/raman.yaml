# Raman analysis configuration
models:
  - peak_2_model
  - peak_3_model
  - peak_4_model
  - peak_5_model
selection_metric: aic
fit:
  # 1) ROI / comparison windows
  x_min: 340.0
  x_max: 430.0
  compare_x_min: 350.0
  compare_x_max: 440.0

  # 2) Ordering / anchor policy
  enforce_peak_order: true
  # two_stage_anchor.enabled: enable peak_2 anchor stage
  # two_stage_anchor.window: clamp E2g/A1g center search to anchor +/- window
  two_stage_anchor:
    enabled: true
    window: 2.0
  # 2-1) Automatic second-pass refinement (y_corr objective)
  auto_refine:
    enabled: true
    min_rmse_improvement: 0.01

  # 3) Anchor seeds / relative offsets
  # Used as base seeds; when two-stage anchor is active, E2g/A1g of n>=3 models
  # are re-seeded from peak_2 anchor result (within the window above).
  e2g_init: 384.0
  a1g_init: 403.0
  lo_offset_from_e2g: -5.0
  zo_offset_from_a1g: 5.0
  la_offset_from_a1g: 50.0

  # 4) Center bounds
  e2g_min: 370.0
  e2g_max: 392.0
  a1g_min: 395.0
  a1g_max: 415.0
  center_tolerance_by_model:
    peak_2_model: 2.5
    peak_3_model: 2.5
    peak_4_model: 2.5
    peak_5_model: 2.5

  # 5) Width bounds
  sigma_min: 0.5
  sigma_max: 12.0
  sigma_bounds_by_peak:
    lo: [2.5, 9.0]
    e2g: [1.5, 6.0]
    a1g: [1.5, 6.0]
    zo: [2.5, 9.0]
    la: [5.0, 20.0]

  # 6) Model priors
  height_scales:
    peak_2_model: [0.50, 0.90]
    peak_3_model: [0.12, 0.50, 0.90]
    peak_4_model: [0.12, 0.50, 0.90, 0.20]
    peak_5_model: [0.12, 0.50, 0.90, 0.20, 0.20]
  model_windows:
    peak_2_model:
      x_min: 350.0
      x_max: 440.0
      left_base: [355.0, 360.0]
      right_base: [430.0, 435.0]
    peak_3_model:
      x_min: 350.0
      x_max: 440.0
      left_base: [355.0, 360.0]
      right_base: [430.0, 435.0]
    peak_4_model:
      x_min: 350.0
      x_max: 440.0
      left_base: [355.0, 360.0]
      right_base: [430.0, 435.0]
    peak_5_model:
      x_min: 350.0
      x_max: 483.0
      left_base: [350.0, 360.0]
      right_base: [477.0, 483.0]

  # 7) Prefit gate
  prefit:
    # Thresholds (enabled, *_snr_*_min) live in thresholds.yaml at the workspace/app root.
    peak_window_half_width: 2.5
    noise_windows:
      left: [350.0, 360.0]
      right: [480.0, 490.0]

si_calibration:
  # Thresholds (min_points, max_abs_offset) live in thresholds.yaml at the workspace/app root.
  enabled: true
  window_min: 510.0
  window_max: 530.0
  target_peak: 520.0
  initial_width: 3.0

report_export:
  include_selected_fitted_y: false
  include_all_candidates: true
  include_candidate_fitted_y: false

# post_selection_qc (delta / mahalanobis outlier checks) lives in thresholds.yaml.
