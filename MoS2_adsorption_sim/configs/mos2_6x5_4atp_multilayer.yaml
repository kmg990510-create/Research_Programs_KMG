    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 150.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.27, 0.30]

  L3_N4_ABA_anti:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 330.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.27, 0.30]

  L3_N4_ABC_par:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 150.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.02, 0.05]

  L3_N4_ABC_anti:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 330.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.02, 0.05]

  L3_N4_B_par:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 150.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.52, 0.55]

  L3_N4_brick_par:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 150.0
    stagger_frac: 0.5
    row_azimuth_step_deg: 0.0
    offset_frac: [0.27, 0.30]

  L3_N4_cross90:
    base_case: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    layer_index: 3
    grid_nx: 2
    grid_ny: 2
    pattern: "parallel"
    tilt_deg: 0.0
    azimuth_deg: 240.0
    stagger_frac: 0.0
    row_azimuth_step_deg: 0.0
    offset_frac: [0.02, 0.05]

vacancy_desorption:
  source_cases:
    - "L1_N4_parallel"
    - "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    - "best_of:L3_N4_ABA_par,L3_N4_ABA_anti,L3_N4_ABC_par,L3_N4_ABC_anti,L3_N4_B_par,L3_N4_brick_par,L3_N4_cross90"
  remove_mol_index: 0
  sequential_pairs:
    L2_N1_ontop_par: "L1_N4_parallel"
    L2_N1_ontop_anti: "L1_N4_parallel"
    L2_N1_bridge_anti: "L1_N4_parallel"
    L2_N1_bridge_par: "L1_N4_parallel"
    L3_N1_A_par: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    L3_N1_B_anti: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"
    L3_N1_C_par: "best_of:L2_N4_AA_par,L2_N4_AA_anti,L2_N4_AB_x_anti,L2_N4_AB_y_anti,L2_N4_AB_diag_anti,L2_N4_AB_diag_par,L2_N4_brick_anti,L2_N4_cross90"

disulfide_check:
  enabled: false
  s_s_bond_A: 2.05
  c_s_s_angle_deg: 103.0
  dihedral_deg: 85.0
  h_h_bond_A: 0.74
  o_o_bond_A: 1.21
  h2o_oh_bond_A: 0.96
  h2o_angle_deg: 104.5
  initial_height_A: 3.1
  azimuth_deg: 0.0

thermal_analysis:
  temperatures_C: [40.0, 60.0, 100.0, 150.0]
  prefactors_hz: [1.0e+12, 1.0e+13, 1.0e+14]
  anneal_duration_s: 3600.0
  min_intermol_hbond_cutoff_A: 3.5
